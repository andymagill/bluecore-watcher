# Implements 03-INGESTION.md §2's git write protocol (ADR-005), M1 scope:
# checkout main -> branch -> orchestrate -> (no change: stop) -> commit ->
# push -> resolve preview -> gate (checks 1-3) -> squash-merge or leave
# branch + open issue. Serialized via the `ingest` concurrency group so two
# overlapping runs can't both fork from the same `main` (§2).
#
# M1 scope: one target (bluecore-newsroom, --only) via the real HttpFetcher
# (--live). The workflow-level cron matches that target's own schedule
# (0 13 * * *) -- a real `plan`/due-date step is an M2 concern once more
# than one cadence is live (docs/07-ROADMAP.md M1 judgment call).
name: Ingest

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  checks: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (shallow)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for gate check 3)
        run: npx playwright install --with-deps chromium

      - name: Compute run id
        id: meta
        run: echo "run_id=$(date -u +%Y-%m-%dT%H-%M-%S)-000Z-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # fetch -> extract -> validate -> diff -> persist, plus the offline
      # gate (checks 1-2) inline before any write (src/ingest/orchestrate.ts
      # runAndPersist). continue-on-error so a failure here is handled by
      # the explicit steps below rather than aborting the job silently.
      - name: Run ingestion (--live, --only bluecore-newsroom)
        id: ingest
        continue-on-error: true
        run: npm run ingest -- --env bluecore --only bluecore-newsroom --live

      - name: Detect semantic change (ADR-011)
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Offline gate failed -- open an issue and stop
        if: steps.ingest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingestion offline gate failed (${{ steps.meta.outputs.run_id }})" \
            --body "Schema validation or contract assertions failed during ingestion -- an engine defect (03-INGESTION.md §3), not a source problem. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label alert
          exit 1

      - name: No semantic change -- nothing to do
        if: steps.changes.outputs.changed == 'false'
        run: echo "No fingerprint changed (ADR-011) -- exiting with no branch, no write."

      # --- Everything below only runs when something actually changed ---

      - name: Commit and push the ingest branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="ingest/${{ steps.meta.outputs.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/
          git commit -m "data: ingest run ${{ steps.meta.outputs.run_id }}"
          git push origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the Workers Builds preview URL
        if: steps.changes.outputs.changed == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          URL=$(npx tsx scripts/resolve-preview-url.ts --sha "${{ steps.branch.outputs.sha }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run the gate (checks 1-3) against the preview
        if: steps.changes.outputs.changed == 'true'
        id: gate
        continue-on-error: true
        run: npm run gate -- --preview-url "${{ steps.preview.outputs.url }}"

      # Direct squash-merge rather than gh pr create + gh pr merge: the
      # default GITHUB_TOKEN cannot create pull requests unless the repo
      # explicitly enables "Allow GitHub Actions to create and approve pull
      # requests" (confirmed live, 2026-09-12: `gh pr create` failed with
      # "Resource not accessible by integration") -- decided against
      # widening that repo permission for this. `main` still only ever
      # receives changes that passed all three gate checks; it just isn't
      # routed through a PR to do it.
      - name: Gate passed -- squash-merge into main
        if: steps.changes.outputs.changed == 'true' && steps.gate.outcome == 'success'
        run: |
          git checkout main
          git merge --squash "${{ steps.branch.outputs.branch }}"
          git commit -m "data: ingest run ${{ steps.meta.outputs.run_id }}"
          git push origin main
          git push origin --delete "${{ steps.branch.outputs.branch }}"

      - name: Gate failed -- leave the branch, open an issue
        if: steps.changes.outputs.changed == 'true' && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingestion gate failed (${{ steps.meta.outputs.run_id }})" \
            --body "Branch \`${{ steps.branch.outputs.branch }}\` failed the gate and was left unmerged -- main is untouched, still serving the last good data. Preview: ${{ steps.preview.outputs.url }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label alert
          exit 1
