# Implements 03-INGESTION.md §2's git write protocol (ADR-005), M1 scope:
# checkout main -> branch -> orchestrate -> (no change: stop) -> commit ->
# push -> resolve preview -> gate (checks 1-3) -> squash-merge or leave
# branch + open issue. Serialized via the `ingest` concurrency group so two
# overlapping runs can't both fork from the same `main` (§2).
#
# M1 scoped this to one target (bluecore-newsroom, --only) on that target's
# own cron (0 13 * * *). M2a (docs/07-ROADMAP.md) drops --only: every
# target now runs on this one daily cron, regardless of its own `cron`
# field, which stays documentation and the basis for `ttlHours`. This is
# deliberately not a per-target due-date planner -- every target's
# ttlHours is >= 48h, so a daily run under-polls nothing, and per-target
# politeness (SEC UA + 2s interval, Lever's Crawl-delay: 1, etc.) is already
# enforced inside HttpFetcher regardless of workflow cadence. A real
# due-date planner is still deferred until more than one cadence actually
# needs to diverge from daily.
#
# M3a (ADR-019, docs/plans/m3-operability.md) adds alerting: on a
# successful squash-merge, scripts/alert-dispatch.ts diffs public/data as
# committed before and after this run and opens/updates/closes GitHub
# Issues for it. On either gate failure it dispatches through the same
# script's --pipeline-failure mode instead of an inline `gh issue create`,
# so a run of consecutive failures keeps one deduped issue rather than one
# per run. The `push` trigger on `config/**` exists so a merged repair PR
# (M3b) re-ingests immediately and its alert can auto-close, rather than
# waiting for the next scheduled cron.
#
# ADR-023 -- preview mode. schedule/push always target `main` (prod), but a
# manual `workflow_dispatch` can be run "from" any branch. `env.PREVIEW`
# (true whenever the dispatched ref isn't `main`) checks that branch's own
# tip out, runs the full fetch -> extract -> validate -> diff -> gate
# pipeline against a real Cloudflare preview exactly as prod does, and stops
# there: it never squash-merges into `main` and never opens/closes/comments
# on a GitHub Issue (`--issues` is only ever passed in prod mode; without it
# alert-dispatch.ts's normal mode just prints the plan, and its
# --pipeline-failure mode makes no GitHub API call at all). This is how a
# branch like an ingestion-changing PR gets a real end-to-end run -- gate
# included -- before it ever touches `main`. See docs/06-OPS-RUNBOOK.md §12.
name: Ingest

on:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches: [main]
    paths: ["config/**"]
  workflow_dispatch: {}

concurrency:
  # Preview runs (one group per branch) never queue behind or block prod's
  # `ingest-main` group, and a stale preview run for the same branch is
  # cancelled by a newer one; prod stays serialized and never cancelled
  # (ADR-005 -- each run must fork from the current `main`).
  group: ingest-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: write
  issues: write
  checks: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PREVIEW: ${{ github.ref_name != 'main' }}
    steps:
      - name: Checkout target ref (shallow)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for gate check 3)
        run: npx playwright install --with-deps chromium

      - name: Compute run id
        id: meta
        run: |
          echo "run_id=$(date -u +%Y-%m-%dT%H-%M-%S)-000Z-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # M3a: main's HEAD before this run touches anything -- the "prev"
          # side of alert-dispatch.ts's committed-state diff.
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # fetch -> extract -> validate -> diff -> persist, plus the offline
      # gate (checks 1-2) inline before any write (src/ingest/orchestrate.ts
      # runAndPersist). continue-on-error so a failure here is handled by
      # the explicit steps below rather than aborting the job silently.
      # EIA_API_KEY is only consumed by the one target whose config
      # declares auth.secretEnv: "EIA_API_KEY" -- if the secret is unset,
      # that target skips with AUTH_ERROR (03-INGESTION.md §6) and every
      # other target still runs.
      - name: Run ingestion (--live, all targets)
        id: ingest
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: npm run ingest -- --env bluecore --live

      - name: Detect semantic change (ADR-011)
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # No --issues in preview mode (env.PREVIEW) -- alert-dispatch.ts's
      # --pipeline-failure mode makes no GitHub API call at all without it,
      # so a broken branch just fails the run red, same as any other CI
      # failure, with no issue opened against a branch that isn't `main`.
      - name: Offline gate failed -- dispatch a pipeline alert and stop
        if: steps.ingest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--pipeline-failure offline --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          [ "$PREVIEW" = "true" ] || ARGS+=(--issues)
          npx tsx scripts/alert-dispatch.ts "${ARGS[@]}"
          exit 1

      - name: No semantic change -- nothing to do
        if: steps.changes.outputs.changed == 'false'
        run: echo "No fingerprint changed (ADR-011) -- exiting with no branch, no write."

      # --- Everything below only runs when something actually changed ---

      - name: Commit and push the ingest branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          if [ "$PREVIEW" = "true" ]; then
            SAFE_REF=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
            BRANCH="ingest-preview/$SAFE_REF/${{ steps.meta.outputs.run_id }}"
          else
            BRANCH="ingest/${{ steps.meta.outputs.run_id }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/
          git commit -m "data: ingest run ${{ steps.meta.outputs.run_id }}"
          git push origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the Workers Builds preview URL
        if: steps.changes.outputs.changed == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          URL=$(npx tsx scripts/resolve-preview-url.ts --sha "${{ steps.branch.outputs.sha }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run the gate (checks 1-3) against the preview
        if: steps.changes.outputs.changed == 'true'
        id: gate
        continue-on-error: true
        run: npm run gate -- --preview-url "${{ steps.preview.outputs.url }}"

      # Direct squash-merge rather than gh pr create + gh pr merge: the
      # default GITHUB_TOKEN cannot create pull requests unless the repo
      # explicitly enables "Allow GitHub Actions to create and approve pull
      # requests" (confirmed live, 2026-09-12: `gh pr create` failed with
      # "Resource not accessible by integration") -- decided against
      # widening that repo permission for this. `main` still only ever
      # receives changes that passed all three gate checks; it just isn't
      # routed through a PR to do it.
      - name: Gate passed -- squash-merge into main
        if: steps.changes.outputs.changed == 'true' && steps.gate.outcome == 'success' && env.PREVIEW != 'true'
        id: merge
        run: |
          git checkout main
          git merge --squash "${{ steps.branch.outputs.branch }}"
          git commit -m "data: ingest run ${{ steps.meta.outputs.run_id }}"
          git push origin main
          git push origin --delete "${{ steps.branch.outputs.branch }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # M3a/ADR-019 -- diffs public/data as committed at base_sha (before
      # this run) and the merge just made (after), against the current
      # config's alert rules, and opens/updates/closes GitHub Issues for
      # it. Also closes the deduped pipeline-failure issue if one was open
      # (this merge succeeding is the recovery signal). Runs after the
      # merge, never before -- alerting on data that then failed its gate
      # and never reached main would be worse than not alerting
      # (03-INGESTION.md §4).
      - name: Dispatch alerts for the merged diff
        if: steps.changes.outputs.changed == 'true' && steps.gate.outcome == 'success' && env.PREVIEW != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Defense in depth for alert-dispatch's own secret-scrub pass
          # (src/ingest/scrub.ts) -- the committed data it reads is already
          # scrubbed at persist time, but this costs nothing to also carry.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          npx tsx scripts/alert-dispatch.ts \
            --env bluecore \
            --from "${{ steps.meta.outputs.base_sha }}" \
            --to "${{ steps.merge.outputs.sha }}" \
            --issues

      # Preview's stand-in for the two prod-only steps above: same alert
      # plan (--to the pushed preview branch's own commit, since there's no
      # merge commit) and the same gate result, but printed to the run
      # summary instead of GitHub Issues -- nothing is ever created,
      # commented on, or closed against a non-`main` run.
      - name: Preview summary
        if: steps.changes.outputs.changed == 'true' && env.PREVIEW == 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          {
            echo "### Ingestion preview -- \`${{ github.ref_name }}\`"
            echo ""
            echo "- Branch pushed: \`${{ steps.branch.outputs.branch }}\`"
            echo "- Preview URL: ${{ steps.preview.outputs.url }}"
            echo "- Gate: \`${{ steps.gate.outcome }}\`"
            echo ""
            echo "#### public/data diff"
            echo '```'
            git diff --stat "${{ steps.meta.outputs.base_sha }}" "${{ steps.branch.outputs.sha }}" -- public/data
            echo '```'
            echo ""
            echo "#### Alerts that would fire (not dispatched -- preview mode)"
            echo '```'
            npx tsx scripts/alert-dispatch.ts --env bluecore --from "${{ steps.meta.outputs.base_sha }}" --to "${{ steps.branch.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate failed -- leave the branch, dispatch a pipeline alert
        if: steps.changes.outputs.changed == 'true' && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--pipeline-failure gate --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --branch "${{ steps.branch.outputs.branch }}" --preview-url "${{ steps.preview.outputs.url }}")
          [ "$PREVIEW" = "true" ] || ARGS+=(--issues)
          npx tsx scripts/alert-dispatch.ts "${ARGS[@]}"
          exit 1
